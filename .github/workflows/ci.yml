name: CI

# This repository's root IS the .NET solution (OTT_API == dotnet_api), so paths are relative to
# the repo root — unlike the monorepo-root workflow at ../.github which never triggered here.

on:
  push:
    branches: [API, main, develop]
  pull_request:
    branches: [API, main]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ── Build + unit tests (EF InMemory — no database service required) ──────────
  build-test:
    runs-on: ubuntu-latest
    name: Build & Unit Test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore OTT.sln

      - name: Build (solution incl. API + Worker)
        run: dotnet build OTT.sln --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test OTT.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"
        env:
          Jwt__Secret: "test_secret_key_for_ci_at_least_64_characters_abcdefghijklmnop"

  # ── Integration tests (REAL SQL Server + Redis via Testcontainers) ───────────
  # OTT.IntegrationTests is not in OTT.sln; it is restored/run on its own. The ubuntu runner's
  # Docker daemon hosts the SQL Server + Redis containers the tests spin up.
  integration-test:
    runs-on: ubuntu-latest
    name: Integration Tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run integration tests
        run: dotnet test OTT.IntegrationTests/OTT.IntegrationTests.csproj --configuration Release --verbosity normal

  # ── Validate the runtime images build ────────────────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    name: Docker Image Build
    needs: [build-test, integration-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
